name: Check add-on links

on:
  pull_request:
    paths:
      - "docs/4.0/**"
      - "scripts/check-addon-links.js"
  push:
    branches:
      - main
  schedule:
    # Catches slugs renamed on avohq.io after the docs were written.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-addon-links.js
